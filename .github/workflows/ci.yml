name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          dependency-graph: generate-and-submit
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless check
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build CAP
        run: ./gradlew --no-daemon :applet:buildCap

      - name: Run tests
        run: ./gradlew --no-daemon :tests:test

      - name: Upload CAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: meowl-applet-cap
          path: applet/build/cap/*.cap
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: tests/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish CAP on tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: meowl-applet-cap
          path: ./cap
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: cap/*.cap
          generate_release_notes: true
          fail_on_unmatched_files: true

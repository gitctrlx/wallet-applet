name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (with SDK submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Build CAP
        run: ./gradlew :applet:buildCap

      - name: Run tests
        run: ./gradlew :tests:test

      - name: Upload CAP
        uses: actions/upload-artifact@v7
        with:
          name: meowl-applet-cap
          path: applet/build/cap/meowl-applet.cap
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            tests/build/reports/tests/**
            tests/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

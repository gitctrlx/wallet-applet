#
# Tag-driven release. Produces a verifiable, signed CAP file.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Artefacts attached to the GitHub Release:
#   - meowl-applet.cap        the CAP file
#   - meowl-sbom.cdx.json     CycloneDX 1.6 SBOM
#   - sha256sums.txt          digests of every artefact
#
# The CAP file is also attested via Sigstore keyless signing
# (actions/attest-build-provenance). Verify with:
#
#   gh attestation verify meowl-applet.cap --repo qntx/meowl-applet
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # Sigstore OIDC
      attestations: write # write attestation to the repo

    steps:
      - name: Checkout (with SDK submodule)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Build + test + SBOM
        run: ./gradlew :applet:buildCap :tests:test :applet:cyclonedxDirectBom

      - name: Stage release artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp applet/build/cap/meowl-applet.cap release/
          cp applet/build/reports/meowl-sbom.cdx.json release/
          (cd release && sha256sum * > sha256sums.txt)

      - name: Attest SLSA build provenance
        continue-on-error: true # Only works for public repos on Team/Pro/Free plans
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release/meowl-applet.cap

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/meowl-applet.cap
            release/meowl-sbom.cdx.json
            release/sha256sums.txt

[versions]
# Toolchain
jdk = "21"

# JavaCard
javacard-sdk = "jc320v26.0_kit"    # Oracle JC SDK kit folder name under sdks/
javacard-target = "3.0.5"          # ant-javacard targetsdk (max card compatibility)

# Build tooling
ant-javacard = "26.05.15"
spotless = "7.2.1"

# Card runtime / simulator
jcardsim = "3.0.5.11"

# Host side
apdu4j = "25.03.11"
globalplatformpro = "26.04.20.1"
bouncycastle = "1.79"
slf4j = "2.0.16"

# Testing
junit = "5.11.4"

[libraries]
ant-javacard       = { module = "com.github.martinpaljak:ant-javacard", version.ref = "ant-javacard" }
jcardsim           = { module = "com.klinec:jcardsim",                 version.ref = "jcardsim" }
apdu4j-pcsc        = { module = "com.github.martinpaljak:apdu4j-pcsc", version.ref = "apdu4j" }
apdu4j-core        = { module = "com.github.martinpaljak:apdu4j-core", version.ref = "apdu4j" }
globalplatformpro  = { module = "com.github.martinpaljak:gppro",       version.ref = "globalplatformpro" }
bouncycastle-prov  = { module = "org.bouncycastle:bcprov-jdk18on",     version.ref = "bouncycastle" }
slf4j-api          = { module = "org.slf4j:slf4j-api",                 version.ref = "slf4j" }
slf4j-simple       = { module = "org.slf4j:slf4j-simple",              version.ref = "slf4j" }
junit-bom          = { module = "org.junit:junit-bom",                 version.ref = "junit" }
junit-jupiter      = { module = "org.junit.jupiter:junit-jupiter" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

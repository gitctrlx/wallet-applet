version = 1

[[annotations]]
path = [
    ".github/**",
    ".vscode/**",
    "config/**",
    "gradle/**",
    "**/*.kts",
    "**/*.toml",
    "**/*.properties",
    "**/*.yml",
    "**/*.yaml",
    "**/*.editorconfig",
    "**/*.gitattributes",
    "**/*.gitignore",
    "**/*.gitmodules",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 meowl.social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 meowl.social contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Bignat.java's modular-reduction kernel is adapted from Toporin's Satochip Biginteger
# (GPL-2.0-or-later), which is itself derived from the Radboud University OV-chip 2.0 project
# (GPL-2.0-or-later). Per the GPLv2-or-later upgrade clause this file inherits and re-licenses
# to AGPL-3.0-or-later; both upstream copyright holders are recorded here so REUSE / SPDX
# tooling sees the full attribution chain. The in-source acknowledgement lives in the class
# Javadoc; a concise SPDX header (kept to the project-wide template) lives at the top of the
# file so spotless's licenseHeader gate stays uniform across the codebase.
[[annotations]]
path = "applet/src/main/java/social/meowl/applet/Bignat.java"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 meowl.social contributors",
    "2008-2009 Digital Security (DS) group, Radboud Universiteit Nijmegen (OV-chip 2.0)",
    "2015-2024 Toporin (Satochip)",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

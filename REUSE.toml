version = 1

[[annotations]]
path = [
    ".github/**",
    ".vscode/**",
    "config/**",
    "gradle/**",
    "**/*.kts",
    "**/*.toml",
    "**/*.properties",
    "**/*.yml",
    "**/*.yaml",
    "**/*.editorconfig",
    "**/*.gitattributes",
    "**/*.gitignore",
    "**/*.gitmodules",
]
precedence = "aggregate"

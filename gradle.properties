org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled: `:wallet:buildCap` uses Gradle's legacy Ant
# integration (AntBuilder closure captures script-class references that cannot
# be serialised). The Ant task is the dominant cost of every build, so the
# cache would be invalidated every run anyway.
org.gradle.configuration-cache=false
org.gradle.warning.mode=summary

# Project / CAP version. The CAP package version must be `MAJOR.MINOR`
# (JavaCard converter limitation: each component is a byte).
appletVersion=0.1.0-SNAPSHOT
wallet.capVersion=0.1
